name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Self-test (checksums and parsing, no UEFI access)
        shell: powershell
        run: |
          $p = Start-Process .\Lenovo-Logo-Changer.exe -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { if (Test-Path test-error.txt) { Get-Content test-error.txt }; throw 'self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Lenovo-Logo-Changer
          path: Lenovo-Logo-Changer.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} Lenovo-Logo-Changer.exe --generate-notes
